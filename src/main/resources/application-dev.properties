server.port=8080
spring.application.name=api-gateway

# Desactivar discovery/auto-registration
spring.cloud.discovery.enabled=false
spring.cloud.discovery.reactive.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
spring.cloud.features.enabled=false
spring.cloud.gateway.discovery.locator.enabled=false

# Timeouts (ISO duration es robusto)
spring.cloud.gateway.httpclient.connect-timeout=3000
spring.cloud.gateway.httpclient.response-timeout=PT30S

# Rutas (con placeholders and defaults)
spring.cloud.gateway.routes[0].id=portfolio
spring.cloud.gateway.routes[0].uri=${PORTFOLIO_URL:http://localhost:18080}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/portfolio/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

spring.cloud.gateway.routes[1].id=prices
spring.cloud.gateway.routes[1].uri=${PRICES_URL:http://localhost:18081}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/prices/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

management.endpoints.web.exposure.include=health,info
