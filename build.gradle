plugins {
	id 'org.jetbrains.kotlin.jvm' version '1.9.25'
	id 'org.jetbrains.kotlin.plugin.spring' version '1.9.25'
	id 'org.springframework.boot' version '3.4.6'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.jlleitschuh.gradle.ktlint' version '12.1.0'
}

group = 'com.notivest'
version = '0.0.1-SNAPSHOT'

java {
	toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

/** Importante: BOM de Spring Cloud para versionar los starters de Cloud */
ext {
	set('springCloudVersion', '2024.0.2')
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	/** 🔐 Necesario para ServerHttpSecurity y filtros */
	implementation 'org.springframework.boot:spring-boot-starter-security'

	/** 🌩️ Spring Cloud Gateway (sin versión, la pone el BOM) */
	implementation 'org.springframework.cloud:spring-cloud-starter-gateway'

	/** (Para activar luego) Resource Server JWT (Auth0) */
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

	/** 🧾 Logs JSON → stdout (Fluent Bit / New Relic) */
	implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

	implementation 'org.jetbrains.kotlin:kotlin-reflect'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

kotlin {
	compilerOptions {
		freeCompilerArgs.addAll '-Xjsr305=strict'
	}
}

tasks.named('test') { useJUnitPlatform() }
